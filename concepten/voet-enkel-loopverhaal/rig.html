<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Wat er gebeurt bij één stap — lokaal concept</title><meta name="description" content="Een visueel verhaal over voet, enkel en kuit tijdens lopen. Lokaal concept."><link rel="stylesheet" href="story.css"></head><body><a class="skip" href="#rig-view">Naar het verhaal</a><header class="header"><a class="brand" href="../../index.html">Matthijs van Dam<span aria-hidden="true">.</span></a><nav aria-label="Hoofdnavigatie"><a href="../../artikelen.html">Artikelen</a><a href="index.html#bronnen">Bronnen</a></nav></header><main class="rig-tools"><p class="eyebrow">Lokale bewegingscontrole</p><h1>De stap, uitgekleed.</h1><p>Dezelfde rig als in het verhaal. Botlengten blijven constant. De bewerkte bronbeweging en contactmomenten zijn beschreven in het <a href="motion-manifest.json">manifest</a>.</p><label for="phase-input">Positie in de loopcyclus <output id="phase-output">0%</output></label><input id="phase-input" type="range" min="0" max="1000" value="0"><div class="rig-view" id="rig-view"></div><p><a href="index.html">Naar het scrollverhaal →</a></p><div class="rig-grid"><figure><img src="stills/rig-0.svg" alt="Skeletcontrole op 0% van de voorbeeldcyclus"><figcaption>0% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-1.svg" alt="Skeletcontrole op 8% van de voorbeeldcyclus"><figcaption>8% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-2.svg" alt="Skeletcontrole op 18% van de voorbeeldcyclus"><figcaption>18% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-3.svg" alt="Skeletcontrole op 30% van de voorbeeldcyclus"><figcaption>30% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-4.svg" alt="Skeletcontrole op 45% van de voorbeeldcyclus"><figcaption>45% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-5.svg" alt="Skeletcontrole op 52% van de voorbeeldcyclus"><figcaption>52% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-6.svg" alt="Skeletcontrole op 61% van de voorbeeldcyclus"><figcaption>61% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-7.svg" alt="Skeletcontrole op 75% van de voorbeeldcyclus"><figcaption>75% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-8.svg" alt="Skeletcontrole op 90% van de voorbeeldcyclus"><figcaption>90% van de voorbeeldcyclus</figcaption></figure><figure><img src="stills/rig-9.svg" alt="Skeletcontrole op 100% van de voorbeeldcyclus"><figcaption>100% van de voorbeeldcyclus</figcaption></figure></div></main><script type="module">import {illustration} from './renderer.mjs'; const data=await(await fetch('motion.json')).json();const input=document.querySelector('input');function render(){document.querySelector('#rig-view').innerHTML=illustration(data,input.value/1000,{debug:true});document.querySelector('output').textContent=Math.round(input.value/10)+'%';}input.addEventListener('input',render);render();</script></body></html>
